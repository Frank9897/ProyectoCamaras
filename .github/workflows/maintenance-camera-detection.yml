name: Ajuste de mantenimiento Camera Inspector

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Aplicar filtro estricto y limpiar UI redundante
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $vmPath = 'CameraInspector.App/ViewModels/MainViewModel.cs'
          $vm = Get-Content -Raw -LiteralPath $vmPath

          if ($vm -notmatch 'using CameraInspector\.Network\.Detection;') {
            $vm = $vm.Replace('using CameraInspector.Video;`r`n', 'using CameraInspector.Video;`r`nusing CameraInspector.Network.Detection;`r`n')
            if ($vm -notmatch 'using CameraInspector\.Network\.Detection;') {
              $vm = $vm.Replace('using CameraInspector.Video;`n', "using CameraInspector.Video;`nusing CameraInspector.Network.Detection;`n")
            }
          }

          $old = @'
            // ONVIF es una evidencia, no el requisito. CameraEvidence permite mostrar cámaras propietarias,
            // legacy, mDNS/SSDP o descubiertas por fingerprint especializado.
            var isCameraCandidate = device.CameraEvidence || device.OnvifSupported || device.RtspSupported;
            if (!isCameraCandidate) return;
'@
          $new = @'
            // La misma clasificación estricta se aplica al escaneo principal para impedir
            // que un PC o servidor con RTSP/HTTP abierto termine en el inventario como cámara.
            var classification = CameraDetectionClassifier.Classify(device);
            var isCameraCandidate = classification.IsLikelyCamera;
            if (!isCameraCandidate) return;
'@

          if (-not $vm.Contains($old)) {
            $old = $old -replace "`r`n", "`n"
            $vm = $vm -replace "`r`n", "`n"
          }
          if (-not $vm.Contains($old)) {
            throw 'No se encontró el bloque de clasificación de ResolveDeviceAsync.'
          }
          $vm = $vm.Replace($old, $new)
          Set-Content -LiteralPath $vmPath -Value $vm -Encoding utf8

          # El archivo nuevo de limpieza visual ya elimina los dos selectores redundantes.
          # Esta tarea de mantenimiento se ejecuta una sola vez y luego se elimina del repositorio.
          Remove-Item -LiteralPath '.github/workflows/maintenance-camera-detection.yml' -Force

          git config user.name 'Vasquez Franco'
          git config user.email '116410138+Frank9897@users.noreply.github.com'
          git add CameraInspector.App/ViewModels/MainViewModel.cs CameraInspector.Network/Detection/CameraDetectionClassifier.cs CameraInspector.App/MainWindow.UiCleanup.cs .github/workflows/maintenance-camera-detection.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'No hubo cambios para confirmar.'
          }
          git commit -m 'Aplicar clasificación estricta al escaneo principal'
          git push origin HEAD:main
