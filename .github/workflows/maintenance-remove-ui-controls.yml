name: Limpieza definitiva de selectores de red

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message != 'Eliminar controles redundantes de red'
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Eliminar selectores y botones redundantes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $xamlPath = 'CameraInspector.App/MainWindow.xaml'
          $xaml = Get-Content -Raw -LiteralPath $xamlPath
          $xaml = [regex]::Replace(
            $xaml,
            '(?s)\s*<StackPanel Grid\.Column="1" Orientation="Horizontal">\s*<ComboBox ItemsSource="\{Binding AvailableInterfaces\}".*?</StackPanel>\s*',
            "`r`n")
          Set-Content -LiteralPath $xamlPath -Value $xaml -Encoding utf8

          $localPath = 'CameraInspector.App/MainWindow.LocalCameras.cs'
          $local = Get-Content -Raw -LiteralPath $localPath
          $start = $local.IndexOf('        var controlsPanel = new StackPanel')
          $endMarker = '        headerPanel.Child = headerLayout;'
          $end = $local.IndexOf($endMarker, $start)
          if ($start -ge 0 -and $end -gt $start) {
            $local = $local.Substring(0, $start) + $endMarker + $local.Substring($end + $endMarker.Length)
          }
          Set-Content -LiteralPath $localPath -Value $local -Encoding utf8

          Remove-Item -LiteralPath 'CameraInspector.App/MainWindow.UiCleanup.cs' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.github/workflows/maintenance-remove-ui-controls.yml' -Force -ErrorAction SilentlyContinue

          git config user.name 'Vasquez Franco'
          git config user.email '116410138+Frank9897@users.noreply.github.com'
          git add CameraInspector.App/MainWindow.xaml CameraInspector.App/MainWindow.LocalCameras.cs CameraInspector.App/MainWindow.UiCleanup.cs .github/workflows/maintenance-remove-ui-controls.yml
          git commit -m 'Eliminar controles redundantes de red'
          git push origin HEAD:main
